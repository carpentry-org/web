name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1

      - name: Run tests
        run: |
          set -euo pipefail
          carp -x test/web.carp
          carp -x test/websocket.carp

      - name: Smoke test
        timeout-minutes: 15
        run: ./test/smoke.sh

      - name: Smoke server log
        if: always()
        run: cat smoke-server.log 2>/dev/null || echo "no server log"

      - name: Generate docs
        run: carp -x gendocs.carp
